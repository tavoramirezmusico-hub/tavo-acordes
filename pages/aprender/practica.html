<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica guiada · Tavo Acordes</title>
  <meta name="description" content="Ejercicios con estadísticas de progreso.">
  <link rel="icon" href="../../assets/logo-512.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="site-bar">
    <a href="../../index.html" class="site-bar-logo"><img src="../../assets/logo-512.png" alt="Tavo Acordes"></a>

      <div id="breadcrumb" class="breadcrumb"></div>
      <h1>🏋️ Práctica guiada</h1>

  </header>

  <main class="container">

    <section id="practica" class="card">
      <h2>Práctica Guiada</h2>
      <p style="color:#888; font-size:0.9em; margin-bottom:15px;">

      <div id="practice-content">
        <div id="practice-stats" class="practice-stats"></div>
        <div id="practice-exercise" class="practice-exercise">
          <p class="empty-state">Elige un tipo de ejercicio para empezar.</p>
        </div>
        <div id="practice-menu" class="practice-menu"></div>
      </div>
    </section>

  <footer>
    <p>Tavo Acordes — App de guitarra, armonía y teoría musical.</p>
  </footer>

  <script src="../../js/nav.js"></script>
