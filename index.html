<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavo Acordes</title>
  <style>
    :root {
      --bg: #000; --card: #0d0d0d; --border: #222; --text: #f5f5f5;
      --muted: #888; --orange: #f97316; --glow: rgba(249,115,22,0.35);
      --danger: #ef4444; --nut: #e5e5e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 0 1.25rem 2rem; line-height: 1.5;
    }
    .container { max-width: 940px; margin: 0 auto; }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
      margin: 0 -1.25rem 1.5rem; padding: 0.65rem 1.25rem;
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
      justify-content: center;
    }
    .nav a {
      color: #aaa; text-decoration: none; font-size: 0.8rem; font-weight: 600;
      padding: 0.35rem 0.7rem; border-radius: 6px; border: 1px solid transparent;
    }
    .nav a:hover, .nav a.active { color: var(--orange); border-color: #333; background: #111; }
    .nav-brand { font-weight: 800; color: #fff; font-size: 0.95rem; margin-right: 0.5rem; }
    .nav-brand span { color: var(--orange); }
    header { text-align: center; margin-bottom: 1.5rem; padding-top: 0.5rem; }
    header h1 { font-size: 2rem; font-weight: 800; color: #fff; }
    header h1 span { color: var(--orange); }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .card {
      background: var(--card); border-radius: 12px; padding: 1.35rem;
      margin-bottom: 1.15rem; border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 0.88rem; margin-bottom: 1rem; color: var(--orange);
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    }
    .empty-state { color: var(--muted); text-align: center; padding: 1.2rem; }
    footer { text-align: center; margin-top: 1.5rem; color: #444; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <span class="nav-brand">Tavo <span>Acordes</span></span>
      <a href="#">App completa en este repositorio</a>
    </nav>
    <header>
      <h1>Tavo <span>Acordes</span></h1>
      <p>La app completa se subio. Si ves este placeholder, recarga o descarga index.html de nuevo.</p>
    </header>
    <div class="card">
      <h2>Estado</h2>
      <div class="empty-state">Subiendo archivo completo en el siguiente commit...</div>
    </div>
    <footer>Tavo Acordes</footer>
  </div>
</body>
</html>
